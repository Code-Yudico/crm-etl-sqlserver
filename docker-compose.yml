# Local SQL Server instance so the pipeline can be run on any machine.
# Usage: docker compose up -d   (wait for the healthcheck to report healthy)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crm-etl-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Must match SQL_PASSWORD in your .env file.
      MSSQL_SA_PASSWORD: "Local_Dev_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 encrypts by default; -C trusts the container's self-signed cert.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql_data:
